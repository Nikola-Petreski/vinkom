<head>

    content="KIRBY Производи — Додатоци и производи кои ги надополнуваат перформансите и стилот.">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gidole&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/4baf646c88.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://gidole.github.io/GidoleFont/gidoleFont.css">
  <link rel="icon" type="image/png" href="images_webp/logoW.webp">

  <style>
    @import url('https://gidole.github.io/GidoleFont/gidoleFont.css');

    .font-gidole {
      font-family: 'Gidole', sans-serif !important;
    }

    .modal-overlay {
      transition: opacity 200ms ease;
      opacity: 0;
      pointer-events: none;
    }

    .modal-overlay.visible {
      opacity: 1;
      pointer-events: auto;
      background-color: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
    }

    .modal-content {
      transform: translateY(2vh) scale(0.98);
      opacity: 0;
      transition: transform 200ms cubic-bezier(0.2, 0, 0.2, 1), opacity 200ms ease;
    }

    .modal-content.show {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    #modal-desc {
      white-space: pre-wrap;
    }

    .version-button {
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.05);
      color: #fff;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .version-button.active {
      background: #fff;
      color: #000;
      border-color: rgba(255,255,255,0.85);
    }

    @media (max-width: 768px) {
      .modal-content {
        flex-direction: column;
        padding: 3% !important;
      }
    }

    /* Custom scrollbar for modals */
    .modal-content::-webkit-scrollbar {
      width: 10px;
    }

    .modal-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .modal-content::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    .modal-content {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
    }

    .reveal-letters span {
      opacity: 0;
      transform: translateY(20px);
      display: inline-block;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .reveal-visible span {
      opacity: 1;
      transform: translateY(0);
    }

    #infoDropdownMenu {
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
    }

    #infoChevron,
    #langChevron {
      display: inline-block;
      opacity: 0;
      transform: rotate(0deg);
      transition: transform .25s ease, opacity .15s ease;
    }

    #infoDropdownButton:hover #infoChevron,
    #langDropdownButton:hover #langChevron {
      opacity: 1;
    }

    #infoChevron.rotated,
    #langChevron.rotated {
      transform: rotate(180deg);
    }

    #mobileInfoChevron {
      display: inline-block;
      transition: transform .25s ease;
    }

    #mobileInfoChevron.rotated {
      transform: rotate(180deg);
    }

    #mobileInfoDropdownMenu {
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease;
    }

    #mobileInfoDropdownMenu.open {
      max-height: 500px;
    }

    #mobileLangDropdownMenu {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px) scaleY(0.98);
      transform-origin: top;
      transition: max-height .28s ease, opacity .22s ease, transform .26s cubic-bezier(.2, .9, .2, 1);
    }

    #mobileLangDropdownMenu.open {
      max-height: 240px;
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scaleY(1);
    }

    /* Triggered menu (mobile) smooth open/close */
    #triggeredMenu {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-8px);
      transition: max-height .32s ease, opacity .22s ease, transform .26s cubic-bezier(.2, .9, .2, 1);
    }

    #triggeredMenu.open {
      max-height: 800px;
      opacity: 1;
      transform: translateY(0);
    }

    #mobileNav.mobile-open {
      background-color: rgba(0, 0, 0, 0.25) !important;
    }
  </style>
</head>

  <script>
    // GLOBAL ELEMENTS
    const searchInput = document.getElementById('search-input');
    const sortSelect = document.getElementById('sort-select');
    const extrasGrid = document.getElementById('extras-grid');

    const mobileNav = document.getElementById('mobileNav');

    const nav = document.getElementById('nav');

    // MODAL ELEMENTS
    const productModal = document.getElementById('product-modal');
    const modalImg = document.getElementById('modal-img');
    const modalTitle = document.getElementById('modal-title');
    const versionButtons = document.getElementById('version-buttons');
    const modalDesc = document.getElementById('modal-desc');
    const modalPrice = document.getElementById('modal-price');
    const closeModal = document.getElementById('close-modal');
    let currentModalProduct = null;
    let currentModalVersionIndex = 0;

    function getCategories(product) {
      return Array.isArray(product.category) ? product.category : Array.isArray(product.categories) ? product.categories : [product.category];
    }

    function getCardVersion(extra) {
      return Array.isArray(extra.versions) && extra.versions.length ? extra.versions[0] : extra;
    }

    function getModalVersions(extra) {
      return Array.isArray(extra.versions) && extra.versions.length > 1 ? extra.versions.slice(1) : null;
    }

    function renderModalVersion(extra, versionIndex) {
      const modalVersions = getModalVersions(extra);
      const version = modalVersions && modalVersions[versionIndex]
        ? modalVersions[versionIndex]
        : getCardVersion(extra);
      currentModalProduct = extra;
      currentModalVersionIndex = versionIndex;

      modalTitle.textContent = version.name || extra.fullName;
      const description = version.descriptionHtml ? null : (version.description || extra.longDesc || '');
      if (version.descriptionHtml) {
        modalDesc.innerHTML = version.descriptionHtml;
      } else if (description && /<[^>]+>/.test(description)) {
        modalDesc.innerHTML = description;
      } else {
        modalDesc.textContent = description;
      }
      const modalImageSource = extra.modalImage || version.image || extra.image || 'images_webp/placeholder.webp';
      modalImg.src = modalImageSource;

      const priceValue = typeof version.price === 'number' && version.price > 0 ? version.price : (typeof extra.price === 'number' ? extra.price : 0);
      modalPrice.innerHTML = `<i class="fa-solid fa-tag"></i>Цена: ${priceValue.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.')} ден.`;

      if (modalVersions && versionButtons) {
        versionButtons.innerHTML = '';
        modalVersions.forEach((item, idx) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'version-button px-2 py-1 xs:px-3 xs:py-1 rounded-xl';
          button.textContent = item.label || `Верзија ${idx + 1}`;
          if (idx === versionIndex) button.classList.add('active');
          button.addEventListener('click', () => renderModalVersion(extra, idx));
          versionButtons.appendChild(button);
        });
      } else if (versionButtons) {
        versionButtons.innerHTML = '';
      }

      updateModalAddButtonState();
    }

    function sortFeaturedFirst(items, sortOption) {
      return items.slice().sort((a, b) => {
        const aFeatured = a.featured ? 1 : 0;
        const bFeatured = b.featured ? 1 : 0;
        if (aFeatured !== bFeatured) return bFeatured - aFeatured;
        switch (sortOption) {
          case 'Цена (најниска)': return getEffectivePrice(a) - getEffectivePrice(b);
          case 'Цена (највисока)': return getEffectivePrice(b) - getEffectivePrice(a);
          case 'Попуст (најмал)': return a.discount - b.discount;
          case 'Попуст (најголем)': return b.discount - a.discount;
          default: return 0;
        }
      });
    }

    function getEffectivePrice(e) {
      const version = Array.isArray(e.versions) && e.versions.length ? e.versions[0] : e;
      const basePrice = typeof version.price === 'number' && version.price > 0 ? version.price : e.price;
      return e.discount > 0 ? Math.round(basePrice * (1 - e.discount / 100)) : basePrice;
    }

    // NAV AND MOBILE NAV
    (function () {
      const button = document.getElementById('infoDropdownButton');
      const menu = document.getElementById('infoDropdownMenu');
      const chevron = document.getElementById('infoChevron');
      if (!button || !menu) return;

      const openMenu = () => {
        menu.classList.remove('opacity-0', 'invisible', 'translate-y-2');
        menu.classList.add('opacity-100', 'visible', 'translate-y-0');
        button.setAttribute('aria-expanded', 'true');
        button.classList.remove('bg-transparent');
        button.classList.add('bg-black/80', 'text-white');
        if (chevron) chevron.classList.add('rotated');
      };

      const closeMenu = () => {
        menu.classList.add('opacity-0', 'invisible', 'translate-y-2');
        menu.classList.remove('opacity-100', 'visible', 'translate-y-0');
        button.setAttribute('aria-expanded', 'false');
        button.classList.remove('bg-black/80', 'text-white');
        button.classList.add('bg-transparent');
        if (chevron) chevron.classList.remove('rotated');
      };

      const toggleMenu = (event) => {
        event.stopPropagation();
        if (menu.classList.contains('opacity-0')) {
          openMenu();
        } else {
          closeMenu();
        }
      };

      button.addEventListener('click', toggleMenu);

      document.addEventListener('click', (event) => {
        if (!button.contains(event.target) && !menu.contains(event.target)) {
          closeMenu();
        }
      });
    })();

    (function () {
      const button = document.getElementById('langDropdownButton');
      const menu = document.getElementById('langDropdownMenu');
      const chevron = document.getElementById('langChevron');
      if (!button || !menu) return;

      const openMenu = () => {
        menu.classList.remove('opacity-0', 'invisible', 'translate-y-2');
        menu.classList.add('opacity-100', 'visible', 'translate-y-0');
        button.setAttribute('aria-expanded', 'true');
        button.classList.remove('bg-transparent');
        button.classList.add('text-white');
        if (chevron) chevron.classList.add('rotated');
      };

      const closeMenu = () => {
        menu.classList.add('opacity-0', 'invisible', 'translate-y-2');
        menu.classList.remove('opacity-100', 'visible', 'translate-y-0');
        button.setAttribute('aria-expanded', 'false');
        button.classList.remove('bg-black/90', 'text-white');
        button.classList.add('bg-transparent');
        if (chevron) chevron.classList.remove('rotated');
      };

      const toggleMenu = (event) => {
        event.stopPropagation();
        if (menu.classList.contains('opacity-0')) {
          openMenu();
        } else {
          closeMenu();
        }
      };

      button.addEventListener('click', toggleMenu);

      document.addEventListener('click', (event) => {
        if (!button.contains(event.target) && !menu.contains(event.target)) {
          closeMenu();
        }
      });
    })();

    (function () {
      const button = document.getElementById('mobileInfoDropdownButton');
      const menu = document.getElementById('mobileInfoDropdownMenu');
      const chevron = document.getElementById('mobileInfoChevron');
      if (!button || !menu) return;

      const toggleMenu = (event) => {
        event.stopPropagation();
        if (menu.classList.contains('open')) {
          menu.classList.remove('open');
          chevron.classList.remove('rotated');
          button.setAttribute('aria-expanded', 'false');
        } else {
          menu.classList.add('open');
          chevron.classList.add('rotated');
          button.setAttribute('aria-expanded', 'true');
        }
      };

      button.addEventListener('click', toggleMenu);
    })();

    (function () {
      const button = document.getElementById('mobileLangDropdownButton');
      const menu = document.getElementById('mobileLangDropdownMenu');
      if (!button || !menu) return;

      const toggleMenu = (event) => {
        event.stopPropagation();
        if (menu.classList.contains('open')) {
          menu.classList.remove('open');
          button.setAttribute('aria-expanded', 'false');
        } else {
          menu.classList.add('open');
          button.setAttribute('aria-expanded', 'true');
        }
      };

      button.addEventListener('click', toggleMenu);
      document.addEventListener('click', (event) => {
        if (!button.contains(event.target) && !menu.contains(event.target)) {
          menu.classList.remove('open');
          button.setAttribute('aria-expanded', 'false');
        }
      });
    })();

    (function () {
      const toggle = document.getElementById('mobileMenuToggle');
      const mobileNav = document.getElementById('mobileNav');
      const triggered = document.getElementById('triggeredMenu');
      if (!toggle || !mobileNav || !triggered) return;

      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const opened = triggered.classList.toggle('open');
        if (opened) {
          mobileNav.classList.add('mobile-open');
        } else {
          mobileNav.classList.remove('mobile-open');
        }
      });

      // close when clicking outside
      document.addEventListener('click', (e) => {
        if (!mobileNav.contains(e.target) && triggered.classList.contains('open')) {
          triggered.classList.remove('open');
          mobileNav.classList.remove('mobile-open');
        }
      });
    })();

    (function () {
      const nav = document.getElementById('nav');
      const spacer = document.getElementById('nav-spacer');
      if (!nav) return;

      nav.style.transition = nav.style.transition || 'transform 360ms cubic-bezier(0.2,0,0.2,1), opacity 300ms linear backdrop-filter 300ms ease';
      nav.style.willChange = 'transform, opacity';
      nav.style.transform = nav.style.transform || 'translateY(0)';
      nav.style.opacity = nav.style.opacity || '1';

      function recompute() {
        try {
          const h = Math.ceil(nav.getBoundingClientRect().height);
          if (spacer) spacer.style.height = h + 'px';
        } catch (e) { }
      }
      recompute();
      window.addEventListener('resize', recompute, { passive: true });

      let lastScrollTop = window.pageYOffset || document.documentElement.scrollTop;

      window.addEventListener('scroll', function () {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        if (scrollTop > lastScrollTop + 6) {
          nav.style.transform = 'translateY(-' + (nav.offsetHeight + 4) + 'px)';
          nav.style.opacity = '0';
        } else if (scrollTop < lastScrollTop - 6) {
          nav.style.transform = 'translateY(0)';
          nav.style.opacity = '1';
        } else {
          nav.style.transform = 'translateY(0)';
        }
        lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
      });
    })();

    // SORT CHEVRON ROTATE
    const chevron = document.getElementById('chevron');
    let isRotated = false;
    sortSelect.addEventListener('click', () => {
      isRotated = !isRotated;
      chevron.style.transform = isRotated ? 'rotate(180deg)' : 'rotate(360deg)';
    });

    // CLOSE MODAL
    closeModal.addEventListener('click', () => {
      productModal.classList.add('hidden');
    });
    productModal.addEventListener('click', (e) => {
      if (e.target === productModal) {
        productModal.classList.add('hidden');
      }
    });

    function createCard(extra) {
      const card = document.createElement('div');
      card.className = 'relative group h-[95vw] xs:h-[400px] md:h-[500px] lg:h-[280px] xl:h-[330px] 2xl:h-[395px] 3xl:h-[500px] flex flex-col bg-transparent shadow-black shadow-2xl rounded-xl overflow-hidden extra-card';

      const cardVersion = getCardVersion(extra);
      const displayImage = cardVersion.image || extra.image || 'images_webp/placeholder.webp';
      const displayName = cardVersion.name || extra.fullName;
      const displayShortDesc = cardVersion.description || extra.shortDesc || '';
      const displayPrice = typeof cardVersion.price === 'number' && cardVersion.price > 0 ? cardVersion.price : extra.price;
      let displayPriceText;
      if (extra.discount > 0) {
        const discountedPrice = Math.round(displayPrice * (1 - extra.discount / 100));
        const originalFormatted = displayPrice.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        displayPriceText = `<span style="text-decoration: line-through;">${originalFormatted}</span> <span class="text-[8px] sm:text-sm md:text-lg lg:text-xs xl:text-sm 2xl:text-base 3xl:text-xl text-white">${discountedPrice.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.')} ден.</span>`;
      } else {
        displayPriceText = `Цена: ${displayPrice.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.')} ден.`;
      }

      card.innerHTML = `
                <div class="relative w-full flex justify-center items-center h-[90%] group-hover:h-full transition-all duration-500 ease-in-out bg-cover bg-center rounded-t-xl" style="background-image: url('${displayImage}');">
                    <img src="${displayImage}" loading="lazy" class="object-cover object-center h-full z-10" alt="">
                    <div class="absolute top-0 right-0 h-full w-[95%] 2xl:w-[90%] backdrop-blur-3xl bg-black/40 translate-x-full group-hover:translate-x-0 transition-transform duration-500 ease-in-out flex flex-col justify-between px-[5%] py-[17%] text-white z-20 rounded-l-xl">
                        <div class="flex flex-col w-full gap-2 sm:gap-2 lg:gap-3 text-xs xs:text-base sm:text-sm md:text-xl lg:text-xs xl:text-sm 2xl:text-base 3xl:text-xl">
                            <h3 class="text-sm xs:text-xl md:text-2xl lg:text-base xl:text-lg 2xl:text-xl 3xl:text-3xl font-semibold">${displayName}</h3>
                            <p class="text-white/70">${displayShortDesc}</p>
                            <p class="text-white/70 flex items-center justify-start gap-1"><i class="fa-solid fa-tag"></i>${displayPriceText}</p>
                        </div>
                        <button class="view-more-btn w-full rounded-xl py-[3%] flex justify-center items-center text-white transition-all duration-300 bg-black/40 hover:bg-black/70 text-xs xs:text-lg sm:text-xl lg:text-base 2xl:text-lg">Види повеќе</button>
                    </div>
                </div>
                <p class="h-[10%] group-hover:h-0 opacity-100 group-hover:opacity-0 transition-all duration-500 ease-in-out flex justify-center items-center bg-black/40 rounded-b-xl text-white text-sm xs:text-2xl md:text-3xl lg:text-base xl:text-lg 2xl:text-2xl 3xl:text-3xl">${extra.shortName}</p>
            `;
      card.style.position = 'relative';
      if (extra.discount > 0) {
        const badge = document.createElement('div');
        badge.className = 'absolute top-[3%] -right-0 px-2 bg-red-600 rounded-l-lg shadow-xl shadow-black/60 z-30';
        badge.innerHTML = `<p class="text-[8px] sm:text-sm md:text-lg lg:text-xs xl:text-sm 2xl:text-base 3xl:text-xl uppercase tracking-wide text-white">${extra.discount}% попуст</p>`;
        card.appendChild(badge);
      }

      // Add event listener to view more button
      const viewMoreBtn = card.querySelector('.view-more-btn');
      viewMoreBtn.addEventListener('click', () => {
        currentModalProduct = extra;
        currentModalVersionIndex = 0;
        renderModalVersion(extra, 0);
        updateModalAddButtonState();
        productModal.classList.remove('hidden');
      });

      return card;
    }

    // LOAD EXTRAS
    let allExtras = [];
    let allCards = [];

    fetch('data/extras.json')
      .then(res => res.json())
      .then(extras => {
        allExtras = extras;
        allExtras = sortFeaturedFirst(allExtras, sortSelect.value);
        // Hide discount options if no extras have discounts
        if (!allExtras.some(e => e.discount > 0)) {
          [...sortSelect.options].forEach(opt => { if (opt.textContent.includes('Попуст')) opt.style.display = 'none'; });
        }

        allExtras.forEach(extra => {
          const card = createCard(extra);
          extrasGrid.appendChild(card);
          allCards.push({ extra, card });
        });

        // Event listeners
        searchInput.addEventListener('input', filterAndSort);
        sortSelect.addEventListener('change', filterAndSort);
        document.querySelectorAll('input[name="category"]').forEach(radio => {
          radio.addEventListener('change', filterAndSort);
        });
      });

    // FILTER & SORT FUNCTION
    function filterAndSort() {
      // Record old positions for visible cards
      const oldRects = new Map();
      allCards.forEach(({ card }) => {
        if (card.style.display !== 'none') {
          oldRects.set(card, card.getBoundingClientRect());
        }
      });

      let searchTerm = searchInput.value.toLowerCase();
      const category = document.querySelector('input[name="category"]:checked').value;
      const sortOption = sortSelect.value;

      let filtered = allExtras.filter(e => {
        const categories = getCategories(e);
        return e.fullName.toLowerCase().includes(searchTerm) &&
          (category === 'all' || categories.includes(category));
      });

      filtered = sortFeaturedFirst(filtered, sortOption);

      // Determine new order
      const newOrder = filtered.map(extra => allCards.find(ac => ac.extra.fullName === extra.fullName).card);

      // Update DOM order
      newOrder.forEach(card => extrasGrid.appendChild(card));

      // Set visibility
      allCards.forEach(({ extra, card }) => {
        const shouldShow = filtered.includes(extra);
        if (shouldShow && card.style.display === 'none') {
          // Animate in
          card.style.display = 'block';
          card.style.opacity = '0';
          card.style.transform = 'scale(0)';
          requestAnimationFrame(() => {
            card.style.transition = 'opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            card.style.opacity = '1';
            card.style.transform = 'scale(1)';
          });
        } else if (!shouldShow && card.style.display !== 'none') {
          // Animate out
          card.style.transition = 'opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
          card.style.opacity = '0';
          card.style.transform = 'scale(0)';
          setTimeout(() => {
            card.style.display = 'none';
          }, 300);
        }
      });

      // Record new positions for visible cards
      const newRects = new Map();
      newOrder.forEach(card => {
        newRects.set(card, card.getBoundingClientRect());
      });

      // Animate position changes for cards that were visible and still are
      newOrder.forEach(card => {
        const oldRect = oldRects.get(card);
        const newRect = newRects.get(card);
        if (oldRect && newRect) {
          const deltaX = oldRect.left - newRect.left;
          const deltaY = oldRect.top - newRect.top;
          if (deltaX !== 0 || deltaY !== 0) {
            card.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(1)`;
            card.style.transition = 'none';
            requestAnimationFrame(() => {
              card.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
              card.style.transform = 'translate(0, 0) scale(1)';
            });
          }
        }
      });
    }
  </script>

    <div id="footer-container"></div>

  <div id="cookieBanner" class="fixed bottom-[5%] px-[5%] w-full text-white z-[9999] hidden">
    <div
      class="xs:max-w-[540px] sm:max-w-[576px] md:max-w-[691.2px] lg:max-w-[921.6px] xl:max-w-[1152px] 2xl:max-w-[1382.4px] 3xl:max-w-[1728px] mx-auto lg:mx-0 w-auto lg:w-[450px] 3xl:w-[580px] rounded-xl bg-black/40 backdrop-blur-3xl p-[5%] lg:p-[3%] xl:p-[2%] flex flex-col justify-between items-center gap-[3vw] xl:gap-[1vw]">
      <div class="flex justify-center items-center gap-2 xs:gap-4 md:gap-4">
        <p class="text-sm xs:text-xl md:text-3xl lg:text-lg 3xl:text-2xl">Оваа веб-страница користи колачиња за анализа
          и подобрување на искуството.</p>
        <i
          class="fa-solid fa-cookie text-2xl xs:text-4xl md:text-6xl lg:text-3xl 3xl:text-5xl flex justify-center items-center"></i>
      </div>
      <div class="flex gap-[6%] w-full text-base xs:text-xl md:text-3xl lg:text-xl 3xl:text-3xl">
        <button onclick="rejectCookies()" class="border w-[47%] border-white py-[1%] rounded-xl">Одбиј</button>
        <button onclick="acceptCookies()" class="bg-white w-[47%] text-black py-[1%] rounded-xl">Прифати</button>
      </div>
    </div>
  </div>

  <script>
    function loadCart() {
      return JSON.parse(localStorage.getItem('cart') || '[]');
    }

    function saveCart(cart) {
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function showTooltip(target, message) {
      const existing = document.getElementById('custom-tooltip');
      if (existing) existing.remove();
      const tooltip = document.createElement('div');
      tooltip.id = 'custom-tooltip';
      tooltip.textContent = message;
      tooltip.style.position = 'fixed';
      tooltip.style.zIndex = '9999';
      tooltip.style.background = 'rgba(0,0,0,0.88)';
      tooltip.style.color = '#fff';
      tooltip.style.padding = '0.5rem 0.75rem';
      tooltip.style.borderRadius = '9999px';
      tooltip.style.fontSize = '0.85rem';
      tooltip.style.lineHeight = '1.2';
      tooltip.style.pointerEvents = 'none';
      tooltip.style.opacity = '0';
      tooltip.style.transition = 'opacity 0.2s ease';
      tooltip.style.maxWidth = 'calc(100vw - 32px)';
      tooltip.style.wordBreak = 'break-word';
      document.body.appendChild(tooltip);
      const rect = target.getBoundingClientRect();
      const left = Math.min(window.innerWidth - tooltip.offsetWidth - 8, Math.max(8, rect.left + rect.width / 2 - tooltip.offsetWidth / 2));
      let top = rect.top - tooltip.offsetHeight - 8;
      if (top < 8) top = rect.bottom + 8;
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
      requestAnimationFrame(() => tooltip.style.opacity = '1');
      setTimeout(() => {
        tooltip.style.opacity = '0';
        setTimeout(() => tooltip.remove(), 200);
      }, 2000);
    }

    function updateCartBadge() {
      const cart = loadCart();
      let totalQty = 0;
      cart.forEach(item => {
        totalQty += (item.qty || 1);
      });
      const badge = document.getElementById('cartBadge');
      if (badge) {
        if (totalQty === 0) {
          badge.style.display = "none";
        } else {
          badge.style.display = "inline-flex";
          badge.textContent = totalQty >= 100 ? "99+" : totalQty.toString();
        }
      }
    }

    function addProductToCart(product) {
      const cart = loadCart();
      const existing = cart.find(item => item.name === product.name);
      if (existing) {
        existing.qty = Math.min(99, (existing.qty || 1) + 1);
      } else {
        if (cart.length >= 10) {
          return false;
        }
        cart.push({ id: Date.now(), name: product.name, price: product.price, qty: 1, image: product.image });
      }
      saveCart(cart);
      updateCartBadge();
      updateModalAddButtonState();
      return true;
    }

    function updateModalAddButtonState() {
      const addBtn = document.getElementById('modalAddToCart');
      const titleEl = document.getElementById('modal-title');
      if (!addBtn || !titleEl) return;
      const cart = loadCart();
      const productName = titleEl.textContent.trim();
      const existing = cart.some(item => item.name === productName);
      const disableAdd = !existing && cart.length >= 10;
      addBtn.disabled = disableAdd;
      if (disableAdd) {
        addBtn.classList.add('opacity-50', 'cursor-not-allowed');
        addBtn.setAttribute('aria-disabled', 'true');
      } else {
        addBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        addBtn.removeAttribute('aria-disabled');
      }
    }

    // Update badge when localStorage changes from other pages/tabs
    window.addEventListener('storage', (e) => {
      if (e.key === 'cart') {
        updateCartBadge();
        updateModalAddButtonState();
      }
    });

    (function () {
      const addBtn = document.getElementById('modalAddToCart');
      const checkOutBtn = document.getElementById('checkOutBtn');
      if (!addBtn) return;

      // Update badge and modal add state on page load
      updateCartBadge();
      updateModalAddButtonState();

      addBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (addBtn.getAttribute('aria-disabled') === 'true') {
          showTooltip(addBtn, addBtn.title || 'Достигнат е максималниот број на различни производи во кошничката');
          return;
        }
        if (!currentModalProduct) return;
        const modalVersions = getModalVersions(currentModalProduct);
        const version = modalVersions && modalVersions[currentModalVersionIndex]
          ? modalVersions[currentModalVersionIndex]
          : getCardVersion(currentModalProduct);
        const name = version.name || currentModalProduct.fullName;
        const price = typeof version.price === 'number' ? version.price : (typeof currentModalProduct.price === 'number' ? currentModalProduct.price : 0);
        const imgEl = document.getElementById('modal-img');
        const img = imgEl ? imgEl.src : '';
        addProductToCart({ name, price, image: img });

        if (checkOutBtn) {
          const pEl = checkOutBtn.querySelector('p');
          if (pEl) {
            const defaultText = ' Види кошничка';
            pEl.textContent = ' Додадено во кошничка';
            pEl.classList.remove('opacity-0', 'max-w-0');
            pEl.classList.add('opacity-100', 'max-w-xs');
            setTimeout(() => {
              pEl.textContent = defaultText;
              pEl.classList.remove('opacity-100', 'max-w-xs');
              pEl.classList.add('opacity-0', 'max-w-0');
            }, 2500);
          }
        }
      });
    })();
  </script>
  <script src="cookie.js"></script>
