<style>
.reveal-letters span {
  opacity: 0;
  transform: translateY(20px);
  display: inline-block;
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.reveal-visible span {
  opacity: 1;
  transform: translateY(0);
}

#infoDropdownMenu {
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
}

#infoChevron,
#langChevron {
  display: inline-block;
  opacity: 0;
  transform: rotate(0deg);
  transition: transform .25s ease, opacity .15s ease;
}

#infoDropdownButton:hover #infoChevron,
#langDropdownButton:hover #langChevron {
  opacity: 1;
}

#infoChevron.rotated,
#langChevron.rotated {
  transform: rotate(180deg);
}

#mobileInfoChevron {
  display: inline-block;
  transition: transform .25s ease;
}

#mobileInfoChevron.rotated {
  transform: rotate(180deg);
}

#mobileInfoDropdownMenu {
  max-height: 0;
  overflow: hidden;
  transition: max-height .3s ease;
}

#mobileInfoDropdownMenu.open {
  max-height: 500px;
}

#mobileLangDropdownMenu {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px) scaleY(0.98);
  transform-origin: top;
  transition: max-height .28s ease, opacity .22s ease, transform .26s cubic-bezier(.2,.9,.2,1);
}

#mobileLangDropdownMenu.open {
  max-height: 240px;
  opacity: 1;
  visibility: visible;
  transform: translateY(0) scaleY(1);
}

/* Triggered menu (mobile) smooth open/close */
#triggeredMenu {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transform: translateY(-8px);
  transition: max-height .32s ease, opacity .22s ease, transform .26s cubic-bezier(.2,.9,.2,1);
}

#triggeredMenu.open {
  max-height: 800px;
  opacity: 1;
  transform: translateY(0);
}

#mobileNav.mobile-open {
  background-color: rgba(0,0,0,0.25) !important;
}
/* Minimal slide/fade animation for manual transitions */
.anim-transition {
  transition: transform .36s cubic-bezier(.2,.8,.2,1), opacity .28s ease;
}
.centered { transform: translateX(0); opacity: 1; }
.exit-left { transform: translateX(-30%); opacity: 0; }
.exit-right { transform: translateX(30%); opacity: 0; }
.enter-left { transform: translateX(-30%); opacity: 0; }
.enter-right { transform: translateX(30%); opacity: 0; }
</style>

<script>
(function(){
  const button = document.getElementById('infoDropdownButton');
  const menu = document.getElementById('infoDropdownMenu');
  const chevron = document.getElementById('infoChevron');
  if (!button || !menu) return;

  const openMenu = () => {
    menu.classList.remove('opacity-0', 'invisible', 'translate-y-2');
    menu.classList.add('opacity-100', 'visible', 'translate-y-0');
    button.setAttribute('aria-expanded', 'true');
    button.classList.remove('bg-transparent');
    button.classList.add('bg-black/80', 'text-white');
    if (chevron) chevron.classList.add('rotated');
  };

  const closeMenu = () => {
    menu.classList.add('opacity-0', 'invisible', 'translate-y-2');
    menu.classList.remove('opacity-100', 'visible', 'translate-y-0');
    button.setAttribute('aria-expanded', 'false');
    button.classList.remove('bg-black/80', 'text-white');
    button.classList.add('bg-transparent');
    if (chevron) chevron.classList.remove('rotated');
  };

  const toggleMenu = (event) => {
    event.stopPropagation();
    if (menu.classList.contains('opacity-0')) {
      openMenu();
    } else {
      closeMenu();
    }
  };

  button.addEventListener('click', toggleMenu);

  document.addEventListener('click', (event) => {
    if (!button.contains(event.target) && !menu.contains(event.target)) {
      closeMenu();
    }
  });
})();

(function(){
  const button = document.getElementById('mobileInfoDropdownButton');
  const menu = document.getElementById('mobileInfoDropdownMenu');
  const chevron = document.getElementById('mobileInfoChevron');
  if (!button || !menu) return;

  const toggleMenu = (event) => {
    event.stopPropagation();
    if (menu.classList.contains('open')) {
      menu.classList.remove('open');
      chevron.classList.remove('rotated');
      button.setAttribute('aria-expanded', 'false');
    } else {
      menu.classList.add('open');
      chevron.classList.add('rotated');
      button.setAttribute('aria-expanded', 'true');
    }
  };

  button.addEventListener('click', toggleMenu);
})();

(function(){
  const button = document.getElementById('mobileLangDropdownButton');
  const menu = document.getElementById('mobileLangDropdownMenu');
  if (!button || !menu) return;

  const toggleMenu = (event) => {
    event.stopPropagation();
    if (menu.classList.contains('open')) {
      menu.classList.remove('open');
      button.setAttribute('aria-expanded', 'false');
    } else {
      menu.classList.add('open');
      button.setAttribute('aria-expanded', 'true');
    }
  };

  button.addEventListener('click', toggleMenu);
  document.addEventListener('click', (event) => {
    if (!button.contains(event.target) && !menu.contains(event.target)) {
      menu.classList.remove('open');
      button.setAttribute('aria-expanded', 'false');
    }
  });
})();

<script>
(function(){
  const toggle = document.getElementById('mobileMenuToggle');
  const mobileNav = document.getElementById('mobileNav');
  const triggered = document.getElementById('triggeredMenu');
  if (!toggle || !mobileNav || !triggered) return;

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const opened = triggered.classList.toggle('open');
    if (opened) {
      mobileNav.classList.add('mobile-open');
    } else {
      mobileNav.classList.remove('mobile-open');
    }
  });

  // close when clicking outside
  document.addEventListener('click', (e) => {
    if (!mobileNav.contains(e.target) && triggered.classList.contains('open')) {
      triggered.classList.remove('open');
      mobileNav.classList.remove('mobile-open');
    }
  });
})();
</script>
<script>
(function(){
    const nav = document.getElementById('nav');
    const spacer = document.getElementById('nav-spacer');
    if(!nav) return;

    nav.style.transition = nav.style.transition || 'transform 360ms cubic-bezier(0.2,0,0.2,1), opacity 300ms linear backdrop-filter 300ms ease';
    nav.style.willChange = 'transform, opacity';
    nav.style.transform = nav.style.transform || 'translateY(0)';
    nav.style.opacity = nav.style.opacity || '1';

    function recompute(){
        try{
            const h = Math.ceil(nav.getBoundingClientRect().height);
            if(spacer) spacer.style.height = h + 'px';
        }catch(e){}
    }
    recompute();
    window.addEventListener('resize', recompute, {passive:true});

    let lastScrollTop = window.pageYOffset || document.documentElement.scrollTop;

    window.addEventListener('scroll', function() {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        if (scrollTop > lastScrollTop + 6) {
            nav.style.transform = 'translateY(-' + (nav.offsetHeight + 4) + 'px)';
            nav.style.opacity = '0';
        } else if (scrollTop < lastScrollTop - 6) {
            nav.style.transform = 'translateY(0)';
            nav.style.opacity = '1';
        } else {
            nav.style.transform = 'translateY(0)';
        }
        lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
    });
})()
</script>
<script>
(function(){
  const leftList = document.getElementById('leftList');
  const rightList = document.getElementById('rightList');
  const manualTitle = document.getElementById('manualTitle');
  const manualImage = document.getElementById('manualImage');
  const manualPdfButton = document.getElementById('manualPdfButton');
  const manualPdfButtonsContainer = document.getElementById('manualPdfButtonsContainer');
  const manualPdfMkd = document.getElementById('manualPdfMkd');
  const manualPdfEng = document.getElementById('manualPdfEng');
  const manualPdfButtonMobile = document.getElementById('manualPdfButtonMobile');
  const manualPdfButtonsContainerMobile = document.getElementById('manualPdfButtonsContainerMobile');
  const manualPdfMkdMobile = document.getElementById('manualPdfMkdMobile');
  const manualPdfEngMobile = document.getElementById('manualPdfEngMobile');
  const manualSelectButton = document.getElementById('manualSelectButton');
  const manualSelectDropdown = document.getElementById('manualSelectDropdown');
  const manualPrev = document.getElementById('manualPrev');
  const manualNext = document.getElementById('manualNext');

  if (!leftList || !rightList || !manualTitle || !manualImage || !manualPdfButton || !manualPdfButtonsContainer || !manualPdfMkd || !manualPdfEng || !manualPrev || !manualNext) return;

  let manuals = [];
  let selectedIndex = 0;
  let listEntries = [];

  const getPdfUrl = (item) => item.mkd_doc || item.eng_doc || item.doc || item.pdf || '#';

  const updatePdfButtons = (item) => {
    if (item.mkd_doc && item.eng_doc) {
      // Show two buttons (desktop)
      manualPdfButton.classList.add('hidden');
      manualPdfButtonsContainer.classList.remove('hidden');
      manualPdfMkd.href = item.mkd_doc;
      manualPdfEng.href = item.eng_doc;
      // Show two buttons (mobile)
      manualPdfButtonMobile.classList.add('hidden');
      manualPdfButtonsContainerMobile.classList.remove('hidden');
      manualPdfMkdMobile.href = item.mkd_doc;
      manualPdfEngMobile.href = item.eng_doc;
    } else {
      // Show single button (desktop)
      manualPdfButton.classList.remove('hidden');
      manualPdfButtonsContainer.classList.add('hidden');
      const url = getPdfUrl(item);
      manualPdfButton.onclick = () => {
        if (url && url !== '#') window.open(url, '_blank');
      };
      // Show single button (mobile)
      manualPdfButtonMobile.classList.remove('hidden');
      manualPdfButtonsContainerMobile.classList.add('hidden');
      manualPdfButtonMobile.onclick = () => {
        if (url && url !== '#') window.open(url, '_blank');
      };
    }
  };

  const updateManualView = (index, direction = 1) => {
    if (!manuals.length) return;
    const newIndex = ((index % manuals.length) + manuals.length) % manuals.length;
    const item = manuals[newIndex];

    // prepare elements
    const img = manualImage;
    const title = manualTitle;
    img.classList.add('anim-transition');
    title.classList.add('anim-transition');

    const exitClass = direction >= 0 ? 'exit-left' : 'exit-right';
    const enterClass = direction >= 0 ? 'enter-right' : 'enter-left';

    const onExited = () => {
      // remove exit listeners
      img.removeEventListener('transitionend', onExited);

      // update content
      img.src = item.image || '';
      img.alt = item.name || '';
      title.textContent = item.name || '';
      // update PDF buttons visibility
      updatePdfButtons(item);

      // remove exit classes before entering
      title.classList.remove(exitClass);
      img.classList.remove(exitClass);

      // set starting position for enter, then force reflow
      title.classList.add(enterClass);
      img.classList.add(enterClass);
      // force reflow
      void img.offsetWidth;

      // animate to centered
      title.classList.remove(enterClass);
      img.classList.remove(enterClass);
      title.classList.add('centered');
      img.classList.add('centered');
    };

    // start exit animation
    title.classList.remove('centered');
    img.classList.remove('centered');
    title.classList.add(exitClass);
    img.classList.add(exitClass);

    // wait for transition to finish on image then swap
    img.addEventListener('transitionend', onExited, { once: true });

    // update highlights for list
      listEntries.forEach((entry, entryIndex) => {
      const isActive = entryIndex === newIndex;
      entry.classList.toggle('text-white', isActive);
      entry.classList.toggle('text-white/60', !isActive);
    });

    // scroll into view after small delay so active is set
    setTimeout(() => {
      const currentEntry = listEntries[newIndex];
      if (currentEntry && typeof currentEntry.scrollIntoView === 'function') {
        currentEntry.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    }, 60);

    selectedIndex = newIndex;
  };

  // PDF button behaviour: open single link or show two buttons for dual-language manuals (no need for click handler, buttons/links are clickable directly)

  // hide buttons container when clicking outside the button area

  // Mobile manual selector dropdown
  manualSelectButton.addEventListener('click', (e) => {
    e.stopPropagation();
    manualSelectDropdown.classList.toggle('hidden');
  });

  document.addEventListener('click', (event) => {
    if (!manualSelectButton.contains(event.target) && !manualSelectDropdown.contains(event.target)) {
      manualSelectDropdown.classList.add('hidden');
    }
  });

  const createEntry = (item, index) => {
    const entry = document.createElement('div');
    entry.className = 'cursor-pointer text-white/60 hover:text-white transition-all duration-300';
    entry.textContent = item.name || '';
    entry.addEventListener('click', () => updateManualView(index, index > selectedIndex ? 1 : -1));
    return entry;
  };

  const renderLists = (items) => {
    leftList.innerHTML = '';
    rightList.innerHTML = '';
    listEntries = [];

    const mid = Math.ceil(items.length / 2);
    items.forEach((item, index) => {
      const entry = createEntry(item, index);
      listEntries.push(entry);
      if (index < mid) {
        leftList.appendChild(entry);
      } else {
        rightList.appendChild(entry);
      }
    });
    
    // Populate mobile dropdown
    manualSelectDropdown.innerHTML = '';
    items.forEach((item, index) => {
      const option = document.createElement('button');
      option.className = 'w-full text-left px-3 py-2 hover:bg-white/20 text-white transition-all duration-300 text-sm xs:text-lg';
      option.textContent = item.name || '';
      option.addEventListener('click', () => {
        updateManualView(index, index > selectedIndex ? 1 : -1);
        manualSelectDropdown.classList.add('hidden');
      });
      manualSelectDropdown.appendChild(option);
    });
  };

  const showError = (message) => {
    console.error(message);
    leftList.textContent = 'Fail to load the list.';
    rightList.textContent = 'Fail to load the list.';
  };

  fetch('./data/manuals.json')
    .then((response) => {
      if (!response.ok) throw new Error('Failed to load manuals.json: ' + response.status);
      return response.json();
    })
    .then((items) => {
      if (!Array.isArray(items) || !items.length) throw new Error('manuals.json must contain a non-empty array');
      manuals = items;
      renderLists(manuals);
      
      // Preload all manual images on page load
      manuals.forEach((manual) => {
        if (manual.image) {
          const img = new Image();
          img.src = manual.image;
        }
      });
      
      // initialize first manual without animation
      const first = manuals[0];
      if (first) {
        manualImage.src = first.image || '';
        manualImage.alt = first.name || '';
        manualTitle.textContent = first.name || '';
        // configure PDF buttons for first item
        updatePdfButtons(first);
        manualImage.classList.add('centered', 'anim-transition');
        manualTitle.classList.add('centered', 'anim-transition');
        listEntries.forEach((entry, entryIndex) => {
          const isActive = entryIndex === 0;
          entry.classList.toggle('text-white', isActive);
          entry.classList.toggle('text-white/60', !isActive);
        });
        selectedIndex = 0;
      }
    })
    .catch((error) => showError(error));

  manualPrev.addEventListener('click', () => updateManualView(selectedIndex - 1));
  manualNext.addEventListener('click', () => updateManualView(selectedIndex + 1));
})();
</script>
