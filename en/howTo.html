<style>
.reveal-letters span {
  opacity: 0;
  transform: translateY(20px);
  display: inline-block;
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.reveal-visible span {
  opacity: 1;
  transform: translateY(0);
}

#infoDropdownMenu {
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
}

#infoChevron,
#langChevron {
  display: inline-block;
  opacity: 0;
  transform: rotate(0deg);
  transition: transform .25s ease, opacity .15s ease;
}

#infoDropdownButton:hover #infoChevron,
#langDropdownButton:hover #langChevron {
  opacity: 1;
}

#infoChevron.rotated,
#langChevron.rotated {
  transform: rotate(180deg);
}

#mobileInfoChevron {
  display: inline-block;
  transition: transform .25s ease;
}

#mobileInfoChevron.rotated {
  transform: rotate(180deg);
}

#mobileInfoDropdownMenu {
  max-height: 0;
  overflow: hidden;
  transition: max-height .3s ease;
}

#mobileInfoDropdownMenu.open {
  max-height: 500px;
}

#mobileLangDropdownMenu {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px) scaleY(0.98);
  transform-origin: top;
  transition: max-height .28s ease, opacity .22s ease, transform .26s cubic-bezier(.2,.9,.2,1);
}

#mobileLangDropdownMenu.open {
  max-height: 240px;
  opacity: 1;
  visibility: visible;
  transform: translateY(0) scaleY(1);
}

/* Triggered menu (mobile) smooth open/close */
#triggeredMenu {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transform: translateY(-8px);
  transition: max-height .32s ease, opacity .22s ease, transform .26s cubic-bezier(.2,.9,.2,1);
}

#triggeredMenu.open {
  max-height: 800px;
  opacity: 1;
  transform: translateY(0);
}

#mobileNav.mobile-open {
  background-color: rgba(0,0,0,0.25) !important;
}

#videoList::-webkit-scrollbar,
#videos::-webkit-scrollbar {
  width: 10px;
}

#videoList::-webkit-scrollbar-track,
#videos::-webkit-scrollbar-track {
  background: transparent;
}

#videoList::-webkit-scrollbar-thumb,
#videos::-webkit-scrollbar-thumb {
  background-color: rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  border: 2px solid transparent;
  background-clip: padding-box;
}

#videoList,
#videos {
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
}

#videos {
  align-content: flex-start;
  align-items: flex-start;
  grid-auto-rows: auto;
}

#videos .video-grid-card {
  display: block;
  height: auto;
  min-height: 0;
  align-self: start;
}

#videos .video-grid-thumb,
#videos .video-grid-thumb img,
#videos .video-grid-thumb video {
  display: block;
  width: 100%;
}

#videos .video-grid-thumb {
  aspect-ratio: 16 / 9;
}

#videos .video-grid-thumb img,
#videos .video-grid-thumb video {
  height: 100%;
  object-fit: cover;
}

.steps-panel {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transform: translateY(-6px);
  transition: max-height .35s ease, opacity .25s ease, transform .3s cubic-bezier(.2,.9,.2,1);
}

.steps-panel.open {
  max-height: 900px;
  opacity: 1;
  transform: translateY(0);
}

.steps-chevron {
  display: inline-block;
  transition: transform .25s ease;
}

.steps-chevron.rotated {
  transform: rotate(180deg);

<script>
(function(){
  const videoList = document.getElementById('videoList');
  const videoPlayer = document.getElementById('videoPlayer');
  const videosGrid = document.getElementById('videos');
  if (!videoList || !videoPlayer || !videosGrid) return;

  let videos = [];
  let activeIndex = 0;
  let stepsVisible = false;
  let listStepsOpen = false;

  const escapeHtml = (value) => String(value || '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  }[char]));

  const renderTextContent = (value) => {
    const text = String(value || '').replace(/\n/g, '<br>');
    const hasHtmlTag = /<\/?[a-z][^>]*>/i.test(text);
    return hasHtmlTag ? text : escapeHtml(text);
  };

  const renderStepContent = (step) => {
    const text = String(step || '').replace(/^\d+[.,]\s*/, '').replace(/\n/g, '<br>');
    const hasHtmlTag = /<\/?[a-z][^>]*>/i.test(text);
    return hasHtmlTag ? text : escapeHtml(text);
  };

  const getYouTubeId = (url) => {
    try {
      const parsedUrl = new URL(url);
      if (parsedUrl.hostname.includes('youtu.be')) {
        return parsedUrl.pathname.replace('/', '');
      }
      if (parsedUrl.hostname.includes('youtube.com')) {
        return parsedUrl.searchParams.get('v');
      }
    } catch (error) {
      return null;
    }
    return null;
  };

  const renderVideoEmbed = (video) => {
    const youtubeId = getYouTubeId(video.videoPath);
    if (youtubeId) {
      return '<iframe class="w-full lg:h-[280px] xl:h-[300px] 2xl:h-[400px] 3xl:h-[500px] aspect-video rounded-xl bg-black" src="https://www.youtube.com/embed/' + youtubeId + '" title="' + escapeHtml(video.videoTitle) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
    }

    const posterAttr = video.thumbnail ? ' poster="' + escapeHtml(video.thumbnail) + '"' : '';
    return '<video class="w-full aspect-video rounded-xl bg-black object-contain" src="' + escapeHtml(video.videoPath) + '"' + posterAttr + ' controls playsinline></video>';
  };

  const renderSteps = (steps, className) => {
    const filteredSteps = (steps || []).filter((step) => step && step.trim());
    if (!filteredSteps.length) {
      return '<p class="' + className + '">No steps available for this video.</p>';
    }

    return '<ol class="' + className + ' list-decimal list-inside space-y-2">' + filteredSteps.map((step) => '<li>' + renderStepContent(step) + '</li>').join('') + '</ol>';
  };

  const setActiveVideo = (index) => {
    activeIndex = index;
    stepsVisible = false;
    listStepsOpen = false;
    render();
    videoPlayer.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  const renderList = () => {
    videoList.innerHTML = videos.slice(1).map((video, visibleIndex) => {
      const index = visibleIndex + 1;
      const isActive = index === activeIndex;
      const hasSteps = (video.steps || []).some((step) => step && step.trim());
      const activeSteps = isActive
        ? '<div class="steps-panel ' + (listStepsOpen ? 'open' : '') + ' ">' + renderSteps(video.steps, 'text-white/70 text-xs xl:text-sm leading-relaxed pl-3 pr-1 pb-3') + '</div>'
        : '';
      const chevron = isActive && hasSteps
        ? '<button type="button" id="toggleListStepsBtn" class="shrink-0 text-white/70 hover:text-white transition-all duration-300 p-1" aria-label="' + (listStepsOpen ? 'Hide Steps' : 'Show Steps') + '" aria-expanded="' + (listStepsOpen ? 'true' : 'false') + '"><i class="fa-solid fa-chevron-down text-xs steps-chevron ' + (listStepsOpen ? 'rotated' : '') + '"></i></button>'
        : '';

      return '<div class="w-full border-b border-white/10 last:border-b-0 pb-2">' +
        '<div class="flex w-full items-start gap-2">' +
          '<button type="button" data-video-index="' + index + '" class="video-select-btn flex-1 text-left text-sm xl:text-base 2xl:text-lg leading-snug transition-all duration-300 hover:text-white ' + (isActive ? 'text-white' : 'text-white/70') + '">' + renderTextContent(video.videoTitle) + '</button>' +
          chevron +
        '</div>' +
        activeSteps +
      '</div>';
    }).join('');
  };

  const renderPlayer = () => {
    const currentVideo = videos[activeIndex];
    const isSetupVideo = currentVideo.videoTitle === 'Kirby Set Up';
    const stepsButton = isSetupVideo
      ? ''
      : '<button id="toggleStepsBtn" type="button" aria-expanded="' + (stepsVisible ? 'true' : 'false') + '" class="border border-white/70 text-sm lg:text-base rounded-xl px-2 py-1 lg:px-4 lg:py-2 text-white/70 hover:text-white hover:bg-white/10 transition-all duration-300 text-nowrap">' + (stepsVisible ? 'Hide Steps' : 'Show Steps') + '</button>';
    videoPlayer.innerHTML =
      '<div class="w-full flex flex-col gap-4">' +
        renderVideoEmbed(currentVideo) +
        '<div class="flex flex-col md:flex-row items-center justify-between text-white px-2 md:px-4 2xl:px-6 gap-4 md:gap-0">' +
          '<h1 class="text-center md:text-start text-lg xs:text-2xl md:text-xl lg:text-2xl md:text-3xl lg:text-xl xl:text-3xl 2xl:text-4xl font-medium leading-tight">' + renderTextContent(currentVideo.videoTitle) + '</h1>' +
          stepsButton +
        '</div>' +
        '<div id="currentVideoSteps" class="steps-panel ' + (stepsVisible ? 'open' : '') + 'px-2 pb-2 md:px-4 2xl:px-6 md:pb-4 2xl:px-6">' +
          renderSteps(currentVideo.steps, 'text-white/70 text-sm md:text-base leading-relaxed space-y-1 lg:space-y-2') +
        '</div>' +
      '</div>';
  };

  const renderGrid = () => {
    videosGrid.innerHTML = videos.slice(1).map((video, visibleIndex) => {
      const index = visibleIndex + 1;
      const youtubeId = getYouTubeId(video.videoPath);
      const thumb = youtubeId
        ? 'https://img.youtube.com/vi/' + youtubeId + '/hqdefault.jpg'
        : video.thumbnail || '';
      const preview = thumb
        ? '<img src="' + escapeHtml(thumb) + '" loading="lazy" class="rounded-t-xl bg-black" alt="">'
        : '<video src="' + escapeHtml(video.videoPath) + '" class="rounded-t-xl bg-black" muted preload="metadata"></video>';

      return '<button type="button" data-video-index="' + index + '" class="video-select-btn video-grid-card group text-left bg-black/40 lg:bg-transparent hover:bg-black/40 rounded-xl transition-all duration-300 overflow-hidden border border-white/10">' +
        '<span class="video-grid-thumb relative block">' +
          preview +
          '<span class="absolute inset-0 flex items-center justify-center bg-black/30 opacity-100 lg:opacity-0 group-hover:opacity-100 transition-all duration-300">' +
            '<span class="flex h-12 w-12 items-center justify-center rounded-full border border-white/70 bg-black/50 text-white translate-y-2 scale-90 group-hover:translate-y-0 group-hover:scale-100 transition-all duration-300"><i class="fa-solid fa-play pl-1"></i></span>' +
          '</span>' +
        '</span>' +
        '<p class="text-white/70 group-hover:text-white transition-all duration-300 p-3 text-sm xs:text-2xl md:text-base lg:text-sm xl:text-base 2xl:text-xl leading-snug">' + renderTextContent(video.videoTitle) + '</p>' +
      '</button>';
    }).join('');
  };

  const render = () => {
    if (!videos.length) return;
    renderList();
    renderPlayer();
    renderGrid();
  };

  document.addEventListener('click', (event) => {
    const videoButton = event.target.closest('.video-select-btn');
    if (videoButton) {
      setActiveVideo(Number(videoButton.dataset.videoIndex));
      return;
    }

    if (event.target.closest('#toggleStepsBtn')) {
      stepsVisible = !stepsVisible;
      const playerSteps = document.getElementById('currentVideoSteps');
      const stepsButton = document.getElementById('toggleStepsBtn');
      if (playerSteps) {
        playerSteps.classList.toggle('open', stepsVisible);
      }
      if (stepsButton) {
        stepsButton.textContent = stepsVisible ? 'Hide Steps' : 'Show Steps';
        stepsButton.setAttribute('aria-expanded', stepsVisible ? 'true' : 'false');
      }
      return;
    }

    if (event.target.closest('#toggleListStepsBtn')) {
      listStepsOpen = !listStepsOpen;
      const listSteps = videoList.querySelector('.steps-panel');
      const listButton = document.getElementById('toggleListStepsBtn');
      const listChevron = listButton ? listButton.querySelector('.steps-chevron') : null;
      if (listSteps) {
        listSteps.classList.toggle('open', listStepsOpen);
      }
      if (listChevron) {
        listChevron.classList.toggle('rotated', listStepsOpen);
      }
      if (listButton) {
        listButton.setAttribute('aria-label', listStepsOpen ? 'Hide Steps' : 'Show Steps');
        listButton.setAttribute('aria-expanded', listStepsOpen ? 'true' : 'false');
      }
    }
  });

  fetch('data/videos.json')
    .then((response) => {
      if (!response.ok) throw new Error('Videos could not be loaded.');
      return response.json();
    })
    .then((data) => {
      videos = Array.isArray(data) ? data : [];
      render();
    })
    .catch((error) => {
      console.error(error);
      videoList.innerHTML = '<p class="text-white/70">Videos could not be loaded.</p>';
    });
})();
</script>

<script>
(function(){
  const button = document.getElementById('infoDropdownButton');
  const menu = document.getElementById('infoDropdownMenu');
  const chevron = document.getElementById('infoChevron');
  if (!button || !menu) return;

  const openMenu = () => {
    menu.classList.remove('opacity-0', 'invisible', 'translate-y-2');
    menu.classList.add('opacity-100', 'visible', 'translate-y-0');
    button.setAttribute('aria-expanded', 'true');
    button.classList.remove('bg-transparent');
    button.classList.add('bg-black/80', 'text-white');
    if (chevron) chevron.classList.add('rotated');
  };

  const closeMenu = () => {
    menu.classList.add('opacity-0', 'invisible', 'translate-y-2');
    menu.classList.remove('opacity-100', 'visible', 'translate-y-0');
    button.setAttribute('aria-expanded', 'false');
    button.classList.remove('bg-black/80', 'text-white');
    button.classList.add('bg-transparent');
    if (chevron) chevron.classList.remove('rotated');
  };

  const toggleMenu = (event) => {
    event.stopPropagation();
    if (menu.classList.contains('opacity-0')) {
      openMenu();
    } else {
      closeMenu();
    }
  };

  button.addEventListener('click', toggleMenu);

  document.addEventListener('click', (event) => {
    if (!button.contains(event.target) && !menu.contains(event.target)) {
      closeMenu();
    }
  });
})();

(function(){

<script>
(function(){
  const toggle = document.getElementById('mobileMenuToggle');
  const mobileNav = document.getElementById('mobileNav');
  const triggered = document.getElementById('triggeredMenu');
  if (!toggle || !mobileNav || !triggered) return;

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const opened = triggered.classList.toggle('open');
    if (opened) {
      mobileNav.classList.add('mobile-open');
    } else {
      mobileNav.classList.remove('mobile-open');
    }
  });

  // close when clicking outside
  document.addEventListener('click', (e) => {
    if (!mobileNav.contains(e.target) && triggered.classList.contains('open')) {
      triggered.classList.remove('open');
      mobileNav.classList.remove('mobile-open');
    }
  });
})();
</script>
<script>
(function(){
    const nav = document.getElementById('nav');
    const spacer = document.getElementById('nav-spacer');
    if(!nav) return;

    nav.style.transition = nav.style.transition || 'transform 360ms cubic-bezier(0.2,0,0.2,1), opacity 300ms linear backdrop-filter 300ms ease';
    nav.style.willChange = 'transform, opacity';
    nav.style.transform = nav.style.transform || 'translateY(0)';
    nav.style.opacity = nav.style.opacity || '1';

    function recompute(){
        try{
            const h = Math.ceil(nav.getBoundingClientRect().height);
            if(spacer) spacer.style.height = h + 'px';
        }catch(e){}
    }
    recompute();
    window.addEventListener('resize', recompute, {passive:true});

    let lastScrollTop = window.pageYOffset || document.documentElement.scrollTop;

    window.addEventListener('scroll', function() {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        if (scrollTop > lastScrollTop + 6) {
            nav.style.transform = 'translateY(-' + (nav.offsetHeight + 4) + 'px)';
            nav.style.opacity = '0';
        } else if (scrollTop < lastScrollTop - 6) {
            nav.style.transform = 'translateY(0)';
            nav.style.opacity = '1';
        } else {
            nav.style.transform = 'translateY(0)';
        }
        lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
    });
})()
</script>

  <button id="backToTop" aria-label="Back to top" aria-hidden="true"
    class="fixed right-[5%] bottom-[5%] xl:hidden z-[9990] bg-[#484848] border border-white text-white rounded-full py-1 px-[10px] xs:py-2 xs:px-4 md:py-3 md:px-4 lg:py-2 lg:px-3 text-lg xs:text-2xl md:text-3xl lg:text-xl 2xl:text-2xl shadow-2xl transition-all duration-300 transform scale-95 opacity-0 pointer-events-none">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  


<script>
(function(){
  const btn = document.getElementById('backToTop');
  const videoPlayer = document.getElementById('videoPlayer');
  if(!btn || !videoPlayer) return;

  let visible = false;

  function show() {
    if (visible) return;
    visible = true;
    btn.setAttribute('aria-hidden','false');
    btn.classList.remove('opacity-0','pointer-events-none','scale-95');
    btn.classList.add('opacity-100','pointer-events-auto','scale-100');
  }
  function hide() {
    if (!visible) return;
    visible = false;
    btn.setAttribute('aria-hidden','true');
    btn.classList.remove('opacity-100','pointer-events-auto','scale-100');
    btn.classList.add('opacity-0','pointer-events-none','scale-95');
  }

  // Use IntersectionObserver to detect when videoPlayer is no longer in view
  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        // Show button when videoPlayer is NOT visible (user has scrolled past it)
        if (!entry.isIntersecting) {
          show();
        } else {
          hide();
        }
      });
    },
    { threshold: 0 } // Trigger when any part of the element leaves view
  );

  observer.observe(videoPlayer);

  btn.addEventListener('click', function(){
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
