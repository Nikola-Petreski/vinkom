    <style>
        @import url('https://gidole.github.io/GidoleFont/gidoleFont.css');

        .font-gidole {
            font-family: 'Gidole', sans-serif !important;
        }
        /* Modal overlay/content transitions + backdrop blur to match models modal */
        .modal-overlay { transition: opacity 200ms ease; opacity: 0; pointer-events: none; }
        .modal-overlay.visible { opacity: 1; pointer-events: auto; background-color: rgba(0,0,0,0.45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
        .modal-content { transform: translateY(2vh) scale(0.98); opacity: 0; transition: transform 200ms cubic-bezier(0.2,0,0.2,1), opacity 200ms ease; }
        .modal-content.show { transform: translateY(0) scale(1); opacity: 1; }
        @media (max-width: 768px){ .modal-content { flex-direction: column; padding: 3% !important; } }
        /* Remove the clock icon in time inputs */
        input[type="time"]::-webkit-calendar-picker-indicator {
            display: none;
        }

    </style>
        <style>
.reveal-letters span {
    opacity: 0;
    transform: translateY(20px);
    display: inline-block;
    transition: opacity 0.5s ease, transform 0.5s ease;
}

.reveal-visible span {
    opacity: 1;
    transform: translateY(0);
}

#infoDropdownMenu {
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
}

#infoChevron,
#langChevron {
    display: inline-block;
    opacity: 0;
    transform: rotate(0deg);
    transition: transform .25s ease, opacity .15s ease;
}

#infoDropdownButton:hover #infoChevron,
#langDropdownButton:hover #langChevron {
    opacity: 1;
}

#infoChevron.rotated,
#langChevron.rotated {
    transform: rotate(180deg);
}

#mobileInfoChevron {
    display: inline-block;
    transition: transform .25s ease;
}

#mobileInfoChevron.rotated {
    transform: rotate(180deg);
}

#mobileInfoDropdownMenu {
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease;
}

#mobileInfoDropdownMenu.open {
    max-height: 500px;
}

#mobileLangDropdownMenu {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px) scaleY(0.98);
    transform-origin: top;
    transition: max-height .28s ease, opacity .22s ease, transform .26s cubic-bezier(.2,.9,.2,1);
}

#mobileLangDropdownMenu.open {
    max-height: 240px;
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scaleY(1);
}

/* Triggered menu (mobile) smooth open/close */
#triggeredMenu {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transform: translateY(-8px);
    transition: max-height .32s ease, opacity .22s ease, transform .26s cubic-bezier(.2,.9,.2,1);
}

#triggeredMenu.open {
    max-height: 800px;
    opacity: 1;
    transform: translateY(0);
}

#mobileNav.mobile-open {
    background-color: rgba(0,0,0,0.25) !important;
}
        </style>
</head>
<body class="overflow-x-hidden font-gidole bg-[#484848]">

    <div id="nav-container"></div>

    <div id="mobile-nav-container"></div>


    <div id="desktopNavSpacer" class="w-full hidden lg:block my-[1.5%]"><div class="w-full h-[10vh] max-h-[110px]"></div></div>
    <div id="mobileNavSpacer" class="py-[2vh] block lg:hidden"><div class="w-full py-[5%] md:py-[3%]"><div class="w-full h-[28px] xs:h-[32px] md:h-[35px]"></div></div></div>


        <script>
    (function(){
        const button = document.getElementById('infoDropdownButton');
        const menu = document.getElementById('infoDropdownMenu');
        const chevron = document.getElementById('infoChevron');
        if (!button || !menu) return;

        const openMenu = () => {
            menu.classList.remove('opacity-0', 'invisible', 'translate-y-2');
            menu.classList.add('opacity-100', 'visible', 'translate-y-0');
            button.setAttribute('aria-expanded', 'true');
            button.classList.remove('bg-transparent');
            button.classList.add('bg-black/80', 'text-white');
            if (chevron) chevron.classList.add('rotated');
        };

        const closeMenu = () => {
            menu.classList.add('opacity-0', 'invisible', 'translate-y-2');
            menu.classList.remove('opacity-100', 'visible', 'translate-y-0');
            button.setAttribute('aria-expanded', 'false');
            button.classList.remove('bg-black/80', 'text-white');
            button.classList.add('bg-transparent');
            if (chevron) chevron.classList.remove('rotated');
        };

        const toggleMenu = (event) => {
            event.stopPropagation();
            if (menu.classList.contains('opacity-0')) {
                openMenu();
            } else {
                closeMenu();
            }
        };

        button.addEventListener('click', toggleMenu);

        document.addEventListener('click', (event) => {
            if (!button.contains(event.target) && !menu.contains(event.target)) {
                closeMenu();
            }
        });
    })();

    (function(){
        const button = document.getElementById('langDropdownButton');
        const menu = document.getElementById('langDropdownMenu');
        const chevron = document.getElementById('langChevron');
        if (!button || !menu) return;

        const openMenu = () => {
            menu.classList.remove('opacity-0', 'invisible', 'translate-y-2');
            menu.classList.add('opacity-100', 'visible', 'translate-y-0');
            button.setAttribute('aria-expanded', 'true');
            button.classList.remove('bg-transparent');
            button.classList.add('text-white');
            if (chevron) chevron.classList.add('rotated');
        };

        const closeMenu = () => {
            menu.classList.add('opacity-0', 'invisible', 'translate-y-2');
            menu.classList.remove('opacity-100', 'visible', 'translate-y-0');
            button.setAttribute('aria-expanded', 'false');
            button.classList.remove('bg-black/90', 'text-white');
            button.classList.add('bg-transparent');
            if (chevron) chevron.classList.remove('rotated');
        };

        const toggleMenu = (event) => {
            event.stopPropagation();
            if (menu.classList.contains('opacity-0')) {
                openMenu();
            } else {
                closeMenu();
            }
        };

        button.addEventListener('click', toggleMenu);

        document.addEventListener('click', (event) => {
            if (!button.contains(event.target) && !menu.contains(event.target)) {
                closeMenu();
            }
        });
    })();

    (function(){
        const button = document.getElementById('mobileInfoDropdownButton');
        const menu = document.getElementById('mobileInfoDropdownMenu');
        const chevron = document.getElementById('mobileInfoChevron');
        if (!button || !menu) return;

        const toggleMenu = (event) => {
            event.stopPropagation();
            if (menu.classList.contains('open')) {
                menu.classList.remove('open');
                chevron.classList.remove('rotated');
                button.setAttribute('aria-expanded', 'false');
            } else {
                menu.classList.add('open');
                chevron.classList.add('rotated');
                button.setAttribute('aria-expanded', 'true');
            }
        };

        button.addEventListener('click', toggleMenu);
    })();

    (function(){
        const button = document.getElementById('mobileLangDropdownButton');
        const menu = document.getElementById('mobileLangDropdownMenu');
        if (!button || !menu) return;

        const toggleMenu = (event) => {
            event.stopPropagation();
            if (menu.classList.contains('open')) {
                menu.classList.remove('open');
                button.setAttribute('aria-expanded', 'false');
            } else {
                menu.classList.add('open');
                button.setAttribute('aria-expanded', 'true');
            }
        };

        button.addEventListener('click', toggleMenu);
        document.addEventListener('click', (event) => {
            if (!button.contains(event.target) && !menu.contains(event.target)) {
                menu.classList.remove('open');
                button.setAttribute('aria-expanded', 'false');
            }
        });
    })();

    (function(){
        const toggle = document.getElementById('mobileMenuToggle');
        const mobileNav = document.getElementById('mobileNav');
        const triggered = document.getElementById('triggeredMenu');
        if (!toggle || !mobileNav || !triggered) return;

        toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            const opened = triggered.classList.toggle('open');
            if (opened) {
                mobileNav.classList.add('mobile-open');
            } else {
                mobileNav.classList.remove('mobile-open');
            }
        });

        // close when clicking outside
        document.addEventListener('click', (e) => {
            if (!mobileNav.contains(e.target) && triggered.classList.contains('open')) {
                triggered.classList.remove('open');
                mobileNav.classList.remove('mobile-open');
            }
        });
    })();

    (function(){
        const nav = document.getElementById('nav');
        const spacer = document.getElementById('nav-spacer');
        if(!nav) return;

        nav.style.transition = nav.style.transition || 'transform 360ms cubic-bezier(0.2,0,0.2,1), opacity 300ms linear backdrop-filter 300ms ease';
        nav.style.willChange = 'transform, opacity';
        nav.style.transform = nav.style.transform || 'translateY(0)';
        nav.style.opacity = nav.style.opacity || '1';

        function recompute(){
            try{
                const h = Math.ceil(nav.getBoundingClientRect().height);
                if(spacer) spacer.style.height = h + 'px';
            }catch(e){}
        }
        recompute();
        window.addEventListener('resize', recompute, {passive:true});

        let lastScrollTop = window.pageYOffset || document.documentElement.scrollTop;

        window.addEventListener('scroll', function() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop + 6) {
                nav.style.transform = 'translateY(-' + (nav.offsetHeight + 4) + 'px)';
                nav.style.opacity = '0';
            } else if (scrollTop < lastScrollTop - 6) {
                nav.style.transform = 'translateY(0)';
                nav.style.opacity = '1';
            } else {
                nav.style.transform = 'translateY(0)';
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        });
    })();
        </script>
